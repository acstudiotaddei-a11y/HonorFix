const LET=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;};
const tabDi=p=>p.tab||S.ass.tab;
const GG=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'],MM=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
function giornoLungo(iso){if(!iso)return '___';const d=new Date(iso+'T12:00');return GG[d.getDay()]+' '+d.getDate()+' '+MM[d.getMonth()]+' '+d.getFullYear();}
function dataIt(iso){if(!iso)return '___';const[a,m,g]=iso.split('-');return g+'/'+m+'/'+a;}
const oraIt=t=>(t||'___').replace(':','.');
const minuti=t=>{const[h,m]=(t||'0:0').split(':').map(Number);return h*60+m;};
const condNome=id=>(DB.condomini.find(c=>c.id===id)||{}).nome||'';
function conflitto(aId,data,orario){if(!data||!orario)return null;const t=minuti(orario);
 return DB.assemblee.find(x=>x.id!==aId&&x.stato!=='svolta'&&x.ass.c2.data===data&&x.ass.c2.ora&&Math.abs(minuti(x.ass.c2.ora)-t)<DB.imp.durata*60)||null;}

// =============== CALCOLI (li fa il codice, non l'IA) ===============
function votante(u,chi){const by=r=>u.tit.find(t=>t.r===r);
 if(chi==='cond'&&by('cond'))return by('cond').p;
 if(by('usu'))return chi==='str'?((by('nudo')||{}).p||u.rapp):by('usu').p;
 return u.rapp||(u.tit.find(t=>t.r==='prop')||{}).p;}
const tabTot=tab=>S.unita.reduce((s,u)=>s+(+u.mill[tab]||0),0);
function partecipanti(tab,chi){const m={};S.unita.forEach(u=>{const v=+u.mill[tab]||0;if(v<=0)return;const p=votante(u,chi);if(!p)return;(m[p]=m[p]||{pid:p,mill:0,un:[]});m[p].mill+=v;m[p].un.push(u.nome);});
 return Object.values(m).sort((a,b)=>nm(a.pid).localeCompare(nm(b.pid)));}
function delNome(r){return r.del?nm(r.del):(r.delNome||'');}
function presenza(pid){const r=S.pres[pid]||{st:'A'};
 if(r.st==='P')return{in:true,modo:'proprio'};if(r.st==='V')return{in:true,modo:'video'};
 if(r.st==='D'){if(r.del){const d=S.pres[r.del];if(d&&(d.st==='P'||d.st==='V'))return{in:true,modo:'delega',del:delNome(r)};return{in:false,warn:'il delegato non risulta presente'};}
  if(r.delNome&&r.delNome.trim())return{in:true,modo:'delega',del:r.delNome.trim()};return{in:false,warn:'indica il delegato'};}
 return{in:false};}
function quorum(){const tab=S.ass.tab,parts=partecipanti(tab,'ord'),tot=tabTot(tab);const iv=parts.filter(x=>presenza(x.pid).in);const mill=iv.reduce((s,x)=>s+x.mill,0);
 const c1=iv.length>parts.length/2&&mill>=tot*2/3-1e-6,c2=iv.length>=parts.length/3-1e-9&&mill>=tot/3-1e-6;
 return{n:iv.length,tot:parts.length,mill,totM:tot,c1,c2,ok:S.ass.conv==1?c1:c2,parts,iv};}
function calc(p){const m=MAGG[p.magg]||MAGG.ORD;const tab=tabDi(p);const tot=tabTot(tab);const parts=partecipanti(tab,p.chi);
 const rows=parts.map(x=>({...x,pr:presenza(x.pid),escl:!!p.escl[x.pid],v:p.voti[x.pid]||''}));const iv=rows.filter(r=>r.pr.in&&!r.escl);
 const g=k=>{const a=iv.filter(r=>r.v===k);return{n:a.length,m:a.reduce((s,r)=>s+r.mill,0),l:a};};const F=g('F'),C=g('C'),X=g('X');const nv=iv.filter(r=>!r.v);
 if(m.info)return{info:true,rows,iv,parts,tot,F,C,X,nv,tab};
 let ok,req;
 if(m.un){ok=F.n===parts.length&&F.m>=tot-1e-6;req='unanimità dei partecipanti';}
 else{const r=S.ass.conv==1?m.c1:m.c2;const okT=r.t==='int'?F.n>iv.length/2:F.n>=Math.ceil(r.f*parts.length-1e-9);const need=r.m*tot;ok=okT&&F.m>=need-0.005;
  req=(r.t==='int'?'maggioranza degli intervenuti':'almeno '+Math.ceil(r.f*parts.length-1e-9)+' partecipanti')+' e almeno '+f2(Math.ceil(need*100-1e-6)/100)+' millesimi';}
 return{ok,req,rows,iv,parts,tot,F,C,X,nv,tab};}
function chiNome(r){return nm(r.pid)+(r.pr.modo==='delega'?' (per delega a '+r.pr.del+')':'');}
const elenco=l=>l.length?l.map(r=>chiNome(r)+' '+f2(r.mill)).join(', '):'nessuno';

// =============== ESITI (calcolati dal programma, visibili appena tutti hanno votato) ===============
function esitoTesti(p){if(!p)return null;const c=p.chiuso&&p.snap?p.snap:calc(p);if(c.info)return null;if(!p.chiuso&&(c.nv.length||!c.iv.length))return null;
 const unan=c.F.n===c.iv.length&&c.iv.length>0;
 const det=`(favorevoli: ${elenco(c.F.l)}; contrari: ${elenco(c.C.l)}; astenuti: ${elenco(c.X.l)})`;
 const voto=unan?"all'unanimità dei presenti":`a maggioranza, con il voto favorevole di nr. ${c.F.n} condòmini su ${c.iv.length} intervenuti per complessivi millesimi ${f2(c.F.m)} ${det}`;
 if(c.ok)return{ok:true,voto,frase:"L'Assemblea approva "+voto+'.'};
 const no=`non avendo raggiunto la maggioranza richiesta (${c.req}): voti favorevoli nr. ${c.F.n} per millesimi ${f2(c.F.m)} ${det}`;
 return{ok:false,voto:'[NON APPROVATO, '+no+']',frase:'La proposta non è approvata, '+no+'.'};}
function lettereDi(p){if(!p)return 'Allegato ___';const l=S.allegati.map((a,i)=>({a,L:LET(i)})).filter(x=>x.a.punti.includes(p.id)).map(x=>x.L);
 return l.length?(l.length===1?'Allegato '+l[0]:'Allegati '+l.slice(0,-1).join(', ')+' e '+l[l.length-1]):'Allegato ___';}
const vuotoE=k=>k==='voto'?'[esito]':'[esito frase]';
const markE=(p,k)=>{const e=esitoTesti(p);return `<mark class="es${e?(e.ok?'':' no'):' vuoto'}" data-esito="${p?p.id:''}" data-k="${k}">${e?esc(e[k]):vuotoE(k)}</mark>`;};
const CAMPI={'data rendiconto':p=>esc(S.ass.dataRend||'___'),'allegato':p=>esc(lettereDi(p)),'esito':p=>markE(p,'voto'),'esito frase':p=>markE(p,'frase')};
function fraseHtml(p,key){const t=((S.frasi[key]||{}).testo||'').trim();if(!t)return '';
 return t.split('\n').map(r=>'<p>'+esc(r).replace(/\[([^\]]+)\]/g,(m,k)=>CAMPI[k.toLowerCase()]?CAMPI[k.toLowerCase()](p):m)+'</p>').join('');}

// =============== PEZZI DEL VERBALE ===============
function snOdg(){return S.odg.map((p,i)=>`${i+1}. ${esc(p.titolo.replace(/[;.]\s*$/,''))}${i<S.odg.length-1?';':'.'}`).join('<br>');}
function snAppello(){const a=S.ass,q=quorum();const presRows=q.parts.filter(x=>presenza(x.pid).in),assRows=q.parts.filter(x=>!presenza(x.pid).in);
 const extra=Object.keys(S.persone).filter(p=>presenza(p).in&&!q.parts.find(x=>x.pid===p));
 return `<p>L'assemblea elegge a Presidente ${esc(a.presidente||'___')}, che chiama a fungere da segretario ${esc(a.segretario||'___')}. Il Presidente verifica le prove della regolare convocazione di tutti gli aventi diritto; constatato che gli stessi sono stati convocati con il preavviso previsto dall'art. 66 disp.att. del codice civile, e/o con il preavviso eventualmente previsto dal Regolamento di Condominio contrattuale, ove esistente, procede all'appello degli intervenuti con l'ausilio del segretario.</p>
<p>Fatto l'appello alle ore ${esc(a.oraAppello||'___')}, risultano presenti o rappresentati per delega, i Signori:</p>
<table class="bord" data-w="45,40,15"><tbody><tr><th>Nominativo</th><th>Delegato</th><th class="r">Mill.</th></tr>${presRows.map(x=>{const pr=presenza(x.pid);return `<tr><td>${esc(nm(x.pid))}</td><td>${pr.modo==='delega'?esc(pr.del):pr.modo==='video'?'(in videoconferenza)':''}</td><td class="r">${f2(x.mill)}</td></tr>`;}).join('')||'<tr><td>—</td><td></td><td></td></tr>'}</tbody></table>
<p>Risultano assenti, invece, i Signori:</p>
<table class="bord" data-w="85,15"><tbody><tr><th>Nominativo</th><th class="r">Mill.</th></tr>${assRows.map(x=>`<tr><td>${esc(nm(x.pid))}</td><td class="r">${f2(x.mill)}</td></tr>`).join('')||'<tr><td>nessuno</td><td></td></tr>'}</tbody></table>
${extra.length?`<p>Sono inoltre presenti, con diritto di voto solo sugli argomenti di loro competenza: ${extra.map(p=>esc(nm(p))).join(', ')}.</p>`:''}
<p>Essendo intervenuti o rappresentati per delega nr. ${q.n} condòmini su un totale di nr. ${q.tot} convocati, per complessivi millesimi ${f2(q.mill)} del valore totale, ${q.ok?"si può procedere con la discussione e la votazione dei punti all'OdG.":"non si raggiunge il numero legale per la costituzione dell'assemblea."}</p>
${q.ok?"<p>Il Presidente dichiara validamente costituita l'assemblea ed apre la discussione sull'O.D.G.</p>":''}`;}
function bozzaIniziale(){const a=S.ass,T=esc(a.tipo),c=a.conv==2?a.c2:a.c1;let h=`<p class="c"><b>VERBALE DI ASSEMBLEA</b><br><b>${T}</b><br>(C.c., art. 1136)<br><b>- ${esc(S.cond.nome)} -</b></p>`;
 if(a.conv==2&&a.deserta)h+=`<p><b>Verbale dell'Assemblea ${T} di prima convocazione del giorno ${giornoLungo(a.c1.data)}</b></p><p>Alle ore ${oraIt(a.c1.ora)} del giorno ${giornoLungo(a.c1.data)} presso ${esc(a.c1.luogo)} si riunisce in prima convocazione l'Assemblea ${T} del ${esc(S.cond.nome)}. Essendo trascorsa un'ora da quella fissata per la convocazione e constatato che non sono presenti condomini in numero legale per la costituzione dell'Assemblea, l'Amministratore dichiara deserta la seduta, sottoscrivendo il presente verbale.</p><p class="r">L'Amministratore<br>${esc(S.amm.firma)}</p>`;
 h+=`<p><b>Verbale di assemblea ${T} di ${a.conv==2?'seconda':'prima'} convocazione del giorno ${giornoLungo(c.data)}</b></p><p>Oggi ${dataIt(c.data)} alle ore ${oraIt(c.ora)}, presso ${esc(c.luogo)}${a.video?' e in collegamento in videoconferenza':''}, si è radunata in ${a.conv==2?'seconda':'prima'} convocazione l'Assemblea dei condomini dello stabile ${esc(S.cond.nome)}, indetta con regolare avviso comunicato a tutti i condomini, per discutere e deliberare sul seguente:</p><p class="c"><b>Ordine del Giorno</b></p><p data-auto="odg">${snOdg()}</p><div data-auto="appello">${snAppello()}</div>`;
 return h;}
const titoloPunto=p=>{const i=S.odg.indexOf(p);return `<b>Punto ${i+1}° - ${esc(p.titolo.replace(/[;.]\s*$/,''))}${i<S.odg.length-1?';':'.'}</b>`;};
function snChiusura(){const a=S.ass;return `<p>Alle ore ${oraIt(a.chiusura)} il Presidente dichiara chiusa l'Assemblea.</p><table class="nob" data-w="50,50"><tbody><tr><td class="c">Il Presidente<br>${esc(a.presidente||'')}</td><td class="c">Il Segretario<br>${esc(a.segretario||'')}</td></tr></tbody></table>`+(S.allegati.length?`<p><b>Allegati</b><br>${S.allegati.map((x,i)=>`Allegato ${LET(i)} – ${esc(x.titolo)}${x.da?' (consegnato in assemblea da '+esc(x.da)+')':''}`).join('<br>')}</p>`:'');}

// =============== EDITOR ===============
const AUTO={odg:snOdg,appello:snAppello};
const ED=()=>$('#editor');
function salvaDoc(){const ed=ED();if(ed&&S){S.docHtml=ed.innerHTML;save();}}
function aggiornaAuto(force){const ed=ED();if(!ed)return;ed.querySelectorAll('[data-auto]').forEach(el=>{if(!force&&(el.dataset.edited==='1'||(el.dataset.auto==='appello'&&S.cur)))return;if(force)delete el.dataset.edited;const f=AUTO[el.dataset.auto];if(!f)return;const h=f();if(el.innerHTML!==h)el.innerHTML=h;});salvaDoc();}
function aggiornaEsiti(){const ed=ED();if(!ed)return;
 ed.querySelectorAll('mark[data-esito]').forEach(m=>{const p=S.odg.find(x=>x.id===m.dataset.esito);if(!p)return;const e=esitoTesti(p);const t=e?e[m.dataset.k]:vuotoE(m.dataset.k);if(m.textContent!==t)m.textContent=t;m.className='es'+(e?(e.ok?'':' no'):' vuoto');});
 salvaDoc();}
const sezione=p=>ED()&&ED().querySelector(`section[data-punto="${p.id}"]`);
function inserisciSezione(p){const ed=ED();if(!ed)return null;if(sezione(p))return sezione(p);const s=document.createElement('section');s.dataset.punto=p.id;
 s.innerHTML=`<p class="ph">${titoloPunto(p)}</p>`+(MAGG[p.magg].info?'':`<p class="esito-auto">${markE(p,'frase')}</p>`);
 const succ=[...ed.querySelectorAll('section[data-punto]')].find(x=>S.odg.findIndex(o=>o.id===x.dataset.punto)>S.odg.indexOf(p));const ch=ed.querySelector('section[data-chiusura]');
 ed.insertBefore(s,succ||ch||null);p.inserito=true;salvaDoc();return s;}
let RANGE=null;
document.addEventListener('selectionchange',()=>{const s=getSelection();const ed=ED();if(ed&&s.rangeCount){const r=s.getRangeAt(0);if(ed.contains(r.commonAncestorContainer))RANGE=r.cloneRange();}});
function nelCursore(dentro){const ed=ED();return RANGE&&ed&&ed.contains(RANGE.commonAncestorContainer)&&(!dentro||dentro.contains(RANGE.commonAncestorContainer));}
// inserisce dove c'è il cursore (se è nel punto), altrimenti prima dell'esito del punto
function inserisciNelPunto(p,html){const ed=ED();if(!ed)return;const sec=sezione(p)||inserisciSezione(p);
 if(nelCursore(sec)){ed.focus();const s=getSelection();s.removeAllRanges();s.addRange(RANGE);document.execCommand('insertHTML',false,html);}
 else{const t=document.createElement('div');t.innerHTML=html;const ref=sec.querySelector('p.esito-auto');[...t.childNodes].forEach(n=>sec.insertBefore(n,ref));}
 const auto=sec.querySelector('p.esito-auto');if(auto&&[...sec.querySelectorAll('mark[data-esito]')].some(m=>!auto.contains(m)))auto.remove();
 aggiornaEsiti();}
function inserisciQui(html){const ed=ED();if(!ed)return;if(nelCursore()){ed.focus();const s=getSelection();s.removeAllRanges();s.addRange(RANGE);document.execCommand('insertHTML',false,html);}else ed.insertAdjacentHTML('beforeend',html);salvaDoc();}
function ancoraPunto(sec){const m=sec.querySelectorAll('p.mov');return m.length?m[m.length-1]:sec.querySelector('p.ph');}
function movimento(testo){const p=S.odg.find(x=>x.id===S.cur);if(!p||!ED())return;const sec=sezione(p)||inserisciSezione(p);const el=document.createElement('p');el.className='mov';el.textContent=testo;const a=ancoraPunto(sec);sec.insertBefore(el,a?a.nextSibling:sec.firstChild);salvaDoc();}

// =============== RENDER ===============
const FASI=[[1,'Convocazione'],[2,'Svolgimento'],[3,'Verbale'],[4,'Allegati']];
let ULT=-1;
const opt=(v,cur,l)=>`<option value="${esc(v)}" ${v==cur?'selected':''}>${esc(l??v)}</option>`;
function upBtns(target){return `<label class="btn sm upl">+ File<input type="file" multiple accept="application/pdf,image/*" data-up="${target}"></label><label class="btn sm upl">Foto<input type="file" accept="image/*" capture="environment" data-up="${target}"></label>`;}
function header(){const inAss=S&&DB.fase>=1&&DB.fase<=4;
 $('#fasi').style.display=inAss?'flex':'none';
 if(inAss)$('#fasi').innerHTML=FASI.map(([k,t])=>`<button class="${DB.fase===k?'on':''}" data-act="fase" data-arg="${k}">${k<4?`<span>${k}</span>`:''}${t}</button>`).join('');
 $('#hdrSub').textContent=inAss?condNome(S.condId)+' · '+S.ass.tipo+' '+S.ass.esercizio:DB.fase===9?'Impostazioni':'Condomìni';
 const h=$('#hdrQ');if(inAss){const q=quorum();h.style.display='';h.className='pill '+(q.ok?'ok':'ko');h.textContent=q.n+'/'+q.tot+' · '+f2(q.mill)+'‰ · '+(q.ok?'costituita':'non costituita');}else h.style.display='none';}
function render(){header();
 if(DB.fase===2&&ULT===2&&$('#left')&&ED()){const sy=window.scrollY;$('#left').innerHTML=vLeft();window.scrollTo(0,sy);aggiornaAuto();aggiornaEsiti();save();return;}
 if(S&&(DB.fase===2||DB.fase===3)&&!S.docHtml)S.docHtml=bozzaIniziale();
 ULT=DB.fase;const sy=window.scrollY;
 $('#main').innerHTML=DB.fase===0||!S&&DB.fase!==9?vHome():DB.fase===1?vConv():DB.fase===2?vSvolg():DB.fase===3?vVerb():DB.fase===4?vAllegati():vImp();window.scrollTo(0,sy);
 if(S&&(DB.fase===2||DB.fase===3)){aggiornaAuto();aggiornaEsiti();}save();}

 const lista=DB.assemblee.filter(a=>a.condId===c).sort((x,y)=>k(y).localeCompare(k(x)));const oggi=new Date().toISOString().slice(0,10);
 const prossime=DB.assemblee.filter(a=>a.stato!=='svolta'&&(!a.ass.c2.data||a.ass.c2.data>=oggi)).sort((x,y)=>k(x).localeCompare(k(y)));
 return `<div class="home">

</section></div>`;}

function vConv(){const a=S.ass;
 const conv=(k,l)=>`<div class="row" style="align-items:flex-end"><span class="badge" style="min-width:40px;text-align:center;padding:8px">${l}</span>
<label class="f">Data<input type="date" data-bind="ass.${k}.data" value="${esc(a[k].data)}"></label><label class="f">Ora<input type="time" data-bind="ass.${k}.ora" value="${esc(a[k].ora)}"></label>
<label class="f" style="flex:1;min-width:240px">Luogo<input type="text" data-bind="ass.${k}.luogo" value="${esc(a[k].luogo)}"></label><label class="chk"><input type="checkbox" data-bind="ass.${k}.agenda" ${a[k].agenda?'checked':''}> In agenda</label></div>`;
 return `<div class="col" style="gap:14px">
<section class="card col"><div class="row"><h2>Dati generali</h2><label class="btn ai upl" style="margin-left:auto">Importa convocazione (PDF)<input type="file" accept="application/pdf,.pdf" data-up="__conv"></label></div>
<div class="row" style="align-items:flex-end"><div class="seg">${['Ordinaria','Straordinaria'].map(t=>`<button class="P ${a.tipo===t?'on':''}" data-act="tipo" data-arg="${t}">${t}</button>`).join('')}</div>
<label class="f" style="width:130px">Esercizio<input type="text" data-bind="ass.esercizio" value="${esc(a.esercizio)}"></label><label class="f" style="width:110px">N. verbale<input type="text" data-bind="ass.numero" value="${esc(a.numero)}"></label>
<label class="f" style="min-width:220px">Tabella di proprietà<select data-bind="ass.tab">${S.tabelle.map(t=>opt(t.id,a.tab,'TABELLA '+t.id+' "'+t.nome+'"')).join('')}</select></label>
<label class="f" style="width:150px">Rendiconto al<input type="text" data-bind="ass.dataRend" value="${esc(a.dataRend)}" placeholder="30/9/2026"></label></div>

<button class="btn sm" data-act="mv" data-arg="${i}|-1" aria-label="Sposta su" ${i?'':'disabled'}>↑</button><button class="btn sm" data-act="mv" data-arg="${i}|1" aria-label="Sposta giù" ${i<S.odg.length-1?'':'disabled'}>↓</button></div>
<div class="col"><input type="text" data-bind="odg.${i}.titolo" value="${esc(p.titolo)}" style="font-weight:600">
<div class="row" style="align-items:flex-end">
<label class="f">Tabella<select data-bind="odg.${i}.tab">${opt('',p.tab,'come assemblea ('+a.tab+')')}${S.tabelle.map(t=>opt(t.id,p.tab,t.id+' '+t.nome)).join('')}</select></label>
<label class="f" style="flex:1;min-width:250px">Maggioranza<select data-bind="odg.${i}.magg">${Object.entries(MAGG).map(([k,m])=>opt(k,p.magg,m.nome)).join('')}</select></label>

<label class="f">Note <span class="muted">(es. l'introduzione che sai già che farai: la ritrovi nel punto, pronta da inserire)</span><textarea rows="2" data-bind="odg.${i}.note">${esc(p.note)}</textarea></label>
<div class="aiout" id="sug-${i}" style="display:none"></div></div></div>`).join('')||'<span class="muted">Nessun punto. Aggiungine uno o copia l\'ordine del giorno da un\'assemblea precedente.</span>'}</section>

<div class="row"><button class="btn pri" data-act="fase" data-arg="2">Vai allo svolgimento →</button></div></div>`;}

// ---------- 2 SVOLGIMENTO ----------
function vLeft(){const sv=S.sv;const p=S.odg.find(x=>x.id===sv);
 const nav=`<div class="subnav"><button class="${sv==='app'?'on':''}" data-act="sv" data-arg="app">Appello</button>${S.odg.map((x,i)=>{const c=x.chiuso&&x.snap;return `<button class="${sv===x.id?'on':''}" data-act="sv" data-arg="${x.id}">Punto ${i+1}${c?`<span class="d ${c.info||c.ok?'ok':'ko'}">${c.info||c.ok?'✓':'✗'}</span>`:''}</button>`;}).join('')}<button class="${sv==='fine'?'on':''}" data-act="sv" data-arg="fine">Chiusura</button></div>`;
 return nav+(sv==='app'?vAppello():sv==='fine'?vChiusura():p?vPunto(p):vAppello());}
function vSvolg(){return `<div class="svolg"><div class="col" id="left">${vLeft()}</div><div class="docwrap">${vEditor()}</div></div>`;}
function vEditor(){const cmd=(c,l,t)=>`<button class="tbb" data-cmd="${c}" title="${t}" aria-label="${t}">${l}</button>`;
 return `<div class="tb">${cmd('bold','<b>G</b>','Grassetto')}${cmd('italic','<i>C</i>','Corsivo')}${cmd('underline','<u>S</u>','Sottolineato')}<span class="sep"></span>
${cmd('insertUnorderedList','•','Elenco puntato')}${cmd('insertOrderedList','1.','Elenco numerato')}<span class="sep"></span>
${cmd('justifyLeft','⯇','Allinea a sinistra')}${cmd('justifyCenter','≡','Centra')}${cmd('justifyRight','⯈','Allinea a destra')}<span class="sep"></span>
${cmd('undo','↶','Annulla')}${cmd('redo','↷','Ripeti')}<span class="sep"></span>
<button class="tbb w" data-act="insOra">Ora</button><button class="tbb w" data-act="aggPres">Aggiorna presenti</button><button class="tbb w" data-act="nuovaBozza">Ricomincia</button></div>
<div class="doc" id="editor" contenteditable="true" spellcheck="true">${S.docHtml}</div>
<div class="muted" style="margin-top:6px">Scrivi liberamente come in Word. Le parti <mark class="es">evidenziate</mark> sono gli esiti delle votazioni: li compila il programma.</div>`;}
function vPunto(p){const i=S.odg.indexOf(p);const c=p.chiuso&&p.snap?p.snap:calc(p);const live=calc(p);const info=!!MAGG[p.magg].info;const dis=p.chiuso?'disabled':'';const tab=tabDi(p);
 const lett=S.allegati.map((x,k)=>x.punti.includes(p.id)?`<div class="row"><span class="lett">${LET(k)}</span>${esc(x.titolo)} <span class="muted">${x.files.length} file</span></div>`:'').join('');
 return `<section class="card col"><h2>Punto ${i+1}° – ${esc(p.titolo)}</h2>
<div class="row" style="gap:6px"><span class="badge">Tab. ${esc(tab)}</span><span class="badge">${esc(MAGG[p.magg].nome)}</span><span class="badge">Vota: ${esc(CHI[p.chi])}</span></div></section>
<section class="card col"><h3>Discussione</h3>
<div class="row"><button class="mic ${DICT.live?'live':''}" data-act="mic" aria-label="Dettatura" id="micBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><span class="muted" id="micState">${DICT.live?'Ascolto… tocca per fermare':'Tocca il microfono per dettare'}</span></div>
<div class="muted" id="partial" style="font-style:italic;min-height:16px"></div>
<label class="f">Appunti<textarea rows="6" id="appunti" data-bind="odg.${i}.appunti" placeholder="Scrivi o detta qui gli interventi">${esc(p.appunti)}</textarea></label>
<div class="row"><button class="btn" data-act="insAppunti" data-arg="${i}">Inserisci gli appunti nel verbale</button><button class="btn ai" data-act="bozza" data-arg="${i}">Riscrivi gli appunti con Claude</button></div>
<div class="aiout" id="aiOut" style="display:none"></div>
${p.note?`<div class="nota"><div class="muted">Note preparate in convocazione</div><div style="white-space:pre-wrap;font-size:14px">${esc(p.note)}</div><button class="btn sm" data-act="insNote" data-arg="${i}" style="margin-top:6px">Inserisci nel verbale</button></div>`:''}
<label class="f">Frasario<select data-ins="frase" data-arg="${i}"><option value="">Scegli la frase da inserire nel verbale…</option>${Object.entries(S.frasi).map(([k,f])=>`<option value="${k}">${esc(f.nome)}</option>`).join('')}</select></label>
<span class="muted">Appunti, note e frasi vanno nel verbale dove hai il cursore dentro questo punto; altrimenti subito prima dell'esito.</span></section>
${info?'<div class="card muted">Punto senza votazione.</div>':`<section class="col"><div class="row"><h3 style="margin-right:auto">Votazione</h3><button class="btn" data-act="tutti" data-arg="F" ${dis}>Tutti favorevoli</button><button class="btn" data-act="tutti" data-arg="" ${dis}>Azzera</button></div>
<div class="tw"><table class="g"><thead><tr><th>Votante</th><th class="n">Mill. ${esc(tab)}</th><th>Voto</th></tr></thead><tbody>
${(p.chiuso?c.rows:live.rows).map(r=>{const can=r.pr.in&&!r.escl;return `<tr style="${can?'':'opacity:.55'}"><td><strong>${esc(nm(r.pid))}</strong><div class="muted">${esc(r.un.join(' + '))}${r.pr.modo==='delega'?' · delega a '+esc(r.pr.del):r.pr.modo==='video'?' · video':''}${!r.pr.in?' · assente':''}</div>
${r.pr.in?`<label class="muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-act-change="escl" data-arg="${r.pid}" ${r.escl?'checked':''} ${dis}> non vota (conflitto d'interessi)</label>`:''}</td>
<td class="n">${f2(r.mill)}</td><td>${can?`<div class="seg">${[['F','Fav.'],['C','Contr.'],['X','Ast.']].map(([k,t])=>`<button class="${k} ${r.v===k?'on':''}" data-act="voto" data-arg="${r.pid}|${k}" ${dis}>${t}</button>`).join('')}</div>`:'<span class="muted">non vota</span>'}</td></tr>`;}).join('')}</tbody></table></div>
<div class="esito ${c.nv.length&&!p.chiuso?'nd':c.ok?'ok':'ko'}"><div><span class="muted">Esito</span><br><big class="${c.nv.length&&!p.chiuso?'':c.ok?'ok':'ko'}">${c.nv.length&&!p.chiuso?'Votazione in corso':c.ok?'Approvata':'Non approvata'}</big></div>
<div style="font-size:14px;line-height:1.6">Fav. <strong>${c.F.n}</strong> · ${f2(c.F.m)} — Contr. ${c.C.n} · ${f2(c.C.m)} — Ast. ${c.X.n} · ${f2(c.X.m)}<br>Intervenuti con voto ${c.iv.length}/${c.parts.length}${c.nv.length?' · <span class="warn">'+c.nv.length+' senza voto</span>':' · l\'esito è già nel verbale'} · Serve: ${esc(c.req)}</div></div></section>`}
<section class="card col"><div class="row"><h3>Allegati del punto</h3><span class="row" style="margin-left:auto;gap:6px">${upBtns('N|'+p.id)}</span></div>${lett||'<span class="muted">Nessuno. Anche dalla sezione Allegati.</span>'}</section>
<div class="row">${p.chiuso?`<button class="btn" data-act="riapri" data-arg="${i}">Riapri il punto</button>`:`<button class="btn pri" data-act="chiudi" data-arg="${i}" ${!info&&live.nv.length?'disabled':''}>Chiudi punto ${i<S.odg.length-1?'e passa al '+(i+2):'e vai alla chiusura'} →</button>`}</div>`;}

// ---------- 3 VERBALE ----------
function vVerb(){return `<div class="svolg" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)"><div class="col">${vEditor()}</div>
<aside class="col"><section class="card col"><h2>Due documenti</h2>
<button class="btn" data-act="pdf" data-arg="firma">PDF da stampare e firmare in assemblea</button>
<label class="chk"><input type="checkbox" data-bind="ass.firmaFoglio" ${S.ass.firmaFoglio?'checked':''}> aggiungi un foglio firme dei presenti</label>
<button class="btn pri" data-act="pdf" data-arg="fascicolo">Fascicolo per i condòmini (verbale + allegati)</button>
<span class="muted">Il fascicolo chiude con "FEDELMENTE TRASCRITTO – L'AMMINISTRATORE" e la firma, poi ogni allegato con il frontespizio "ALLEGATO A, B…".</span>
<div class="row"><label class="btn sm upl">${DB.firma?'Cambia immagine firma':'Carica immagine firma'}<input type="file" accept="image/*" data-up="__firma"></label>${DB.firma?'<span class="ok" style="font-size:13px;font-weight:600">firma caricata</span><button class="btn sm" data-act="delFirma">Togli</button>':''}</div></section>
<section class="card col"><h2>Controlli</h2>${controlli().map(x=>`<div style="font-size:14px"><strong class="${x[0]?'ok':'warn'}">${x[0]?'✓':'!'}</strong> ${esc(x[1])}</div>`).join('')}</section>
<section class="card col"><div class="row"><h2>Rilettura</h2><button class="btn ai sm" data-act="rivedi" style="margin-left:auto">Rileggi con Claude</button><button class="btn sm" data-act="copia">Copia testo</button></div><div class="aiout" id="revOut">Claude segnala refusi e incoerenze, senza cambiare il testo.</div></section></aside></div>`;}

// ---------- ALLEGATI ----------
function vAllegato(x){const k=S.allegati.indexOf(x);return `<div class="odgrow" style="grid-template-columns:44px minmax(0,1fr)"><span class="lett" style="height:36px;font-size:16px">${LET(k)}</span>
<div class="col"><div class="row"><input type="text" data-bind="allegati.${k}.titolo" data-rv="1" value="${esc(x.titolo)}" style="flex:1;min-width:240px"><button class="btn sm" data-act="delA" data-arg="${x.id}">Togli</button></div>
<div class="row" style="gap:10px"><span class="muted">Richiamato nei punti:</span>${S.odg.map((p,i)=>`<label class="chk"><input type="checkbox" data-act-change="aPunto" data-arg="${k}|${p.id}" ${x.punti.includes(p.id)?'checked':''}> ${i+1}</label>`).join('')}
${x.fase==='assemblea'?`<input type="text" placeholder="consegnato in assemblea da…" data-bind="allegati.${k}.da" data-rv="1" value="${esc(x.da)}" style="width:220px">`:''}</div>
<div class="row">${upBtns('A|'+x.id)}<span class="muted">${x.files.length?x.files.length+' file':'nessun file (nel fascicolo comparirà solo il frontespizio)'}</span></div>
${x.files.length?`<div class="files">${x.files.map(f=>`<div class="file">${f.tipo==='pdf'?'PDF':'Foto'} · ${esc(f.nome)} <span class="muted">${f.pag?f.pag+' pag. · ':''}${Math.round(f.size/1024)} KB</span>${f.tipo==='img'?`<button class="btn sm" data-act="vedi" data-arg="${f.id}">Vedi</button>`:''}<button class="btn sm" data-act="delF" data-arg="${x.id}|${f.id}" style="margin-left:auto">Togli</button></div>`).join('')}</div>`:''}</div></div>`;}
function vAllegati(){const blocco=(titolo,pid,lista)=>`<section class="card col"><div class="row"><h2>${titolo}</h2><span class="row" style="margin-left:auto;gap:6px">${upBtns(pid?'N|'+pid:'G')}<button class="btn sm" data-act="addA" data-arg="${pid||''}">+ Senza file</button></span></div>${lista.length?lista.map(vAllegato).join(''):'<span class="muted">Nessun allegato.</span>'}</section>`;
 return `<div class="col" style="gap:14px"><div class="card muted">Premi il pulsante del punto e allega: si crea un allegato a lettera (A, B, C…). Ogni allegato può essere richiamato anche in altri punti spuntando i numeri.</div>
${S.odg.map((p,i)=>blocco(`Punto ${i+1} – ${esc(p.titolo)}`,p.id,S.allegati.filter(x=>x.punti.includes(p.id)))).join('')}
${blocco('Allegati generali (non legati a un punto)','',S.allegati.filter(x=>!x.punti.length))}</div>`;}

// ---------- IMPOSTAZIONI ----------
function vFrasario(){return `<div class="col" style="margin-top:10px">
<div class="aiout" style="white-space:normal">Scrivi i testi come devono comparire nel verbale. Tra parentesi quadre i soli campi che compila il programma: <b>[esito]</b> («all'unanimità dei presenti» oppure favorevoli, contrari e astenuti), <b>[esito frase]</b> («L'Assemblea approva …»), <b>[allegato]</b> (la lettera dell'allegato del punto), <b>[data rendiconto]</b>.</div>
${Object.entries(DB.frasi).map(([k,f])=>`<div class="card col" style="padding:12px"><div class="row"><input type="text" data-bind="DB.frasi.${k}.nome" value="${esc(f.nome)}" style="font-weight:600;flex:1"><button class="btn sm" data-act="delFrase" data-arg="${k}">Elimina</button></div><textarea rows="${Math.min(10,Math.max(3,Math.ceil(f.testo.length/110)+1))}" data-bind="DB.frasi.${k}.testo">${esc(f.testo)}</textarea></div>`).join('')}
<div class="row"><button class="btn" data-act="addFrase">+ Nuova frase</button></div></div>`;}
function vRip(){const r=DB.rip;const C=DB.condomini.find(c=>c.id===r.cond)||DB.condomini[0];const tab=C.tabelle.find(t=>t.id===r.tab)?r.tab:'A';const tot=C.unita.reduce((s,u)=>s+(+u.mill[tab]||0),0);
 const imp=+String(r.importo).replace(/\./g,'').replace(',','.')||0;
 return `<div class="col" style="margin-top:10px"><div class="row" style="align-items:flex-end"><label class="f">Condominio<select data-bind="DB.rip.cond">${DB.condomini.map(c=>opt(c.id,C.id,c.nome)).join('')}</select></label>
<label class="f">Tabella<select data-bind="DB.rip.tab">${C.tabelle.map(t=>opt(t.id,tab,t.id+' '+t.nome)).join('')}</select></label>
<label class="f">Importo (€)<input type="text" inputmode="decimal" data-bind="DB.rip.importo" data-rer="1" value="${esc(r.importo)}" placeholder="es. 86400"></label></div>
${imp?`<div class="tw"><table class="g"><thead><tr><th>Unità</th><th>Intestatario</th><th class="n">Mill.</th><th class="n">Quota €</th></tr></thead><tbody>${C.unita.filter(u=>+u.mill[tab]>0).map(u=>`<tr><td>${esc(u.nome)}</td><td>${esc(C.persone[u.rapp]||'')}</td><td class="n">${f2(+u.mill[tab])}</td><td class="n">${f2(imp*u.mill[tab]/tot)}</td></tr>`).join('')}</tbody></table></div>`:'<span class="muted">Scrivi un importo per vedere la quota di ogni unità.</span>'}</div>`;}
function vImp(){return `<div class="col" style="gap:14px"><div class="row"><h2 style="font-size:20px">Impostazioni</h2><button class="btn" data-act="torna" style="margin-left:auto">← Torna</button></div>
<section class="card col"><h2>Generali</h2><div class="row"><label class="f" style="min-width:300px">Firma dell'amministratore (verbale di prima convocazione deserta)<input type="text" data-bind="DB.amm.firma" value="${esc(DB.amm.firma)}"></label>
<label class="f" style="width:260px">Distanza minima tra due 2ª convocazioni (ore)<input type="number" min="0" step="0.5" data-bind="DB.imp.durata" value="${esc(DB.imp.durata)}"></label></div></section>
<details class="card" open><summary>Frasario</summary>${vFrasario()}</details>
<details class="card"><summary>Ripartizione virtuale</summary>${vRip()}</details>
<details class="card"><summary>Dati di prova</summary><div class="row" style="margin-top:8px"><button class="btn" data-act="reset">Ricarica i dati di esempio</button><span class="muted">Cancella le prove fatte e riparte dall'esempio.</span></div></details></div>`;}
function vConvocati(){const tab=S.ass.tab;return `<div class="col" style="margin-top:10px">
<div class="row">${S.tabelle.map(t=>{const v=tabTot(t.id);return `<span class="badge" style="padding:6px 10px">${t.id} ${esc(t.nome)}: ${f2(v)} <span class="${Math.abs(v-1000)<0.01?'ok':'ko'}">${Math.abs(v-1000)<0.01?'quadra':'non quadra'}</span></span>`;}).join('')}</div>
<div class="tw"><table class="g"><thead><tr><th>Unità</th><th>Intestatari</th><th class="n">Mill. ${tab}</th><th>Rappresentante</th><th>Vota ord.</th><th>Vota straord.</th></tr></thead><tbody>
${S.unita.map((u,i)=>{const pr=u.tit.filter(t=>t.r==='prop'||t.r==='nudo');return `<tr><td><strong>${esc(u.nome)}</strong></td><td>${u.tit.map(t=>esc(nm(t.p))+(t.r!=='prop'?' <span class="badge">'+RUOLO[t.r]+'</span>':'')).join('<br>')}</td><td class="n">${+u.mill[tab]?f2(+u.mill[tab]):'—'}</td>
<td>${pr.length>1?`<select data-bind="unita.${i}.rapp" data-rer="1">${pr.map(t=>opt(t.p,u.rapp,nm(t.p))).join('')}</select>`:'—'}</td><td>${esc(nm(votante(u,'ord')))}</td><td>${esc(nm(votante(u,'str')))}</td></tr>`;}).join('')}
</tbody></table></div><span class="muted">I millesimi arriveranno dall'importazione dei fogli Excel di Danea (uno per condominio) in un unico foglio controllato.</span></div>`;}
function vAppello(){const q=quorum();const a=S.ass;
 const ruoli={};S.unita.forEach(u=>u.tit.forEach(t=>{const v=[];['ord','str','cond'].forEach(c=>{if(votante(u,c)===t.p)v.push(c)});if(v.length)(ruoli[t.p]=ruoli[t.p]||[]).push({u:u.nome,r:t.r,v});}));
 const lista=Object.keys(ruoli).sort((x,y)=>nm(x).localeCompare(nm(y)));const partT=Object.fromEntries(q.parts.map(x=>[x.pid,x]));
 const presenti=lista.filter(p=>['P','V'].includes((S.pres[p]||{}).st));
 const delCount={};lista.forEach(p=>{const r=S.pres[p];if(r&&r.st==='D'){const k=delNome(r);if(k){(delCount[k]=delCount[k]||{n:0,m:0});delCount[k].n++;delCount[k].m+=(partT[p]||{mill:0}).mill;}}});
 const over=q.tot>20?Object.entries(delCount).filter(([d,c])=>c.n>q.tot/5||c.m>q.totM/5):[];
 return `<section class="card col"><div class="row"><h2>Appello</h2><button class="btn sm" data-act="oraApp" style="margin-left:auto">Fatto l'appello ora${a.oraAppello?' ('+a.oraAppello+')':''}</button></div>
<div class="row"><label class="f" style="flex:1">Presidente<input type="text" list="dlPres" data-bind="ass.presidente" data-rv="1" value="${esc(a.presidente)}"></label><datalist id="dlPres">${[...presenti.map(nm),...Object.keys(delCount)].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
<label class="f" style="flex:1">Segretario<input type="text" data-bind="ass.segretario" data-rv="1" value="${esc(a.segretario)}"></label></div>

const BLOBS={};let IDB=null;
(function(){try{const r=indexedDB.open('verbaliAll4',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>{IDB=r.result};}catch(e){}})();
function idbPut(id,b){try{IDB&&IDB.transaction('f','readwrite').objectStore('f').put(b,id);}catch(e){}}
function idbDel(id){try{IDB&&IDB.transaction('f','readwrite').objectStore('f').delete(id);}catch(e){}}
function idbGet(id){return new Promise(res=>{try{if(!IDB)return res(null);const r=IDB.transaction('f').objectStore('f').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);}catch(e){res(null)}});}
async function getBlob(id){return BLOBS[id]||(BLOBS[id]=await idbGet(id));}
async function riduci(file){const bmp=await createImageBitmap(file);const r=Math.min(1,2000/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*r);c.height=Math.round(bmp.height*r);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return await new Promise(res=>c.toBlob(res,'image/jpeg',0.82));}
async function caricaFile(files,target){
 let al;
 if(target.startsWith('A|'))al=S.allegati.find(x=>x.id===target.slice(2));
 else if(target.startsWith('N|')||target==='G'){const pid=target.slice(2);al={id:'g'+Date.now().toString(36),titolo:(files[0]&&files[0].name||'Documento').replace(/\.[^.]+$/,''),punti:pid?[pid]:[],fase:S.ass.oraAppello?'assemblea':'convocazione',da:'',files:[]};S.allegati.push(al);}
 if(!al)return;
 for(const f of files){const id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);let blob=f,tipo='pdf',pag=0;
  if(f.type.startsWith('image/')){tipo='img';try{blob=await riduci(f);}catch(e){}}
  else if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){try{pag=(await PDFLib.PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:true})).getPageCount();}catch(e){}}
  else{toast('Formato non gestito: '+f.name);continue;}
  BLOBS[id]=blob;idbPut(id,blob);al.files.push({id,nome:f.name,tipo,pag,size:blob.size});}
 render();toast('File aggiunto all\'allegato '+LET(S.allegati.indexOf(al)));}

${[['c1','1ª convocazione',c1],['c2','2ª convocazione',c2]].map(([k,l,c])=>`<div class="row" style="align-items:flex-end"><strong style="width:120px">${l}</strong><label class="f">Data<input type="date" id="imp_${k}_data" value="${esc(c.data||'')}"></label><label class="f">Ora<input type="time" id="imp_${k}_ora" value="${esc(c.ora||'')}"></label><label class="f" style="flex:1;min-width:220px">Luogo<input type="text" id="imp_${k}_luogo" value="${esc(c.luogo||'')}"></label></div>`).join('')}
${cf?`<div class="ko" style="font-weight:600">Attenzione: la 2ª convocazione si sovrappone a ${esc(condNome(cf.condId))} (${dataIt(cf.ass.c2.data)} ore ${esc(cf.ass.c2.ora)}). Cambiala prima di confermare.</div>`:''}
<label class="f">Ordine del giorno <span class="muted">(un punto per riga)</span><textarea id="impOdg" rows="${Math.min(12,(j.odg||[]).length+2)}">${esc((j.odg||[]).join('\n'))}</textarea></label>
<label class="chk"><input type="checkbox" id="impAll"> allega il PDF della convocazione agli allegati generali</label>
<span class="muted">${inAss?'I dati vanno nell\'assemblea aperta se il condominio è lo stesso; se scegli un altro condominio si crea una nuova assemblea.':'Si crea una nuova assemblea nel condominio scelto.'}</span>
<div class="row"><button class="btn pri" data-act="impOk">Conferma e compila</button><button class="btn" data-act="close">Annulla</button></div>`);}
function maggDaTitolo(t){t=t.toLowerCase();if(/varie|eventuali|comunicazion/.test(t))return 'INFO';if(/nomina|conferma.*amministrator|revoca|lit[ie]|causa|straordinari|lavori|rifacimento/.test(t))return 'C4';return 'ORD';}
async function applicaImp(){const g=id=>$('#'+id).value;const condId=g('impCond');
 const c2d=g('imp_c2_data'),c2o=g('imp_c2_ora');
 let A=(S&&DB.fase===1&&S.condId===condId)?S:null;
 const cf=conflitto(A?A.id:'',c2d,c2o);if(cf){toast('La 2ª convocazione si sovrappone a '+condNome(cf.condId)+': cambia data o ora');return;}
 if(!A){const prec=DB.assemblee.filter(x=>x.condId===condId).sort((x,y)=>(y.ass.c2.data||'').localeCompare(x.ass.c2.data||''))[0];A=nuovaAss(condId);
  if(prec){A.ass.esercizio=prec.ass.esercizio.replace(/\d{4}/g,y=>String(+y+1));A.ass.numero=String((+prec.ass.numero||0)+1);}DB.assemblee.push(A);apri(A.id);}
 A.ass.tipo=IMP.j.tipo==='Straordinaria'?'Straordinaria':'Ordinaria';
 ['c1','c2'].forEach(k=>{A.ass[k].data=g('imp_'+k+'_data');A.ass[k].ora=g('imp_'+k+'_ora');if(g('imp_'+k+'_luogo').trim())A.ass[k].luogo=g('imp_'+k+'_luogo').trim();});
 const titoli=g('impOdg').split('\n').map(x=>x.replace(/^\s*\d+[).°]?\s*[-–]?\s*/,'').trim()).filter(Boolean);
 if(titoli.length){A.odg=titoli.map(t=>P(t,'',maggDaTitolo(t),'ord'));A.allegati.forEach(x=>x.punti=[]);A.docHtml='';}
 if($('#impAll').checked){const id='f'+Date.now().toString(36);BLOBS[id]=IMP.file;idbPut(id,IMP.file);A.allegati.push({id:'g'+Date.now().toString(36),titolo:'Avviso di convocazione',punti:[],fase:'convocazione',da:'',files:[{id,nome:IMP.file.name,tipo:'pdf',pag:0,size:IMP.file.size}]});}
 IMP=null;$('#dlg').innerHTML='';DB.fase=1;DB.condSel=condId;ULT=-1;render();window.scrollTo(0,0);toast('Convocazione importata: controlla tabella e maggioranza dei punti');}

// =============== EVENTI ===============
function bersaglio(path){const k=path.split('.');let o=S;if(k[0]==='DB'){o=DB;k.shift();}return[o,k];}
function setPath(path,val){const[o0,k]=bersaglio(path);let o=o0;for(let i=0;i<k.length-1;i++){if(o[k[i]]==null)o[k[i]]={};o=o[k[i]];}o[k[k.length-1]]=val;}
function getPath(path){const[o0,k]=bersaglio(path);return k.reduce((o,x)=>o==null?o:o[x],o0);}
function dlg(html){$('#dlg').innerHTML=`<div class="dlg"><div class="card col">${html}</div></div>`;}
const paragrafi=(t,cls)=>String(t||'').split(/\n+/).filter(x=>x.trim()).map(x=>`<p${cls?` class="${cls}"`:''}>${esc(x.trim())}</p>`).join('');
let rqT;
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='editor'){const s=getSelection();if(s.anchorNode){const el=(s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement).closest('[data-auto]');if(el)el.dataset.edited='1';}salvaDoc();return;}
 const b=t.dataset&&t.dataset.bind;if(!b)return;let v=t.type==='checkbox'?t.checked:t.value;
 if(b==='ass.c2.data'||b==='ass.c2.ora'){const d=b==='ass.c2.data'?v:S.ass.c2.data,o=b==='ass.c2.ora'?v:S.ass.c2.ora;const cf=conflitto(S.id,d,o);
  if(cf){t.value=getPath(b)||'';dlg(`<h2>Data non disponibile</h2><p>Il ${giornoLungo(cf.ass.c2.data)} alle ore ${esc(cf.ass.c2.ora)} c'è già la 2ª convocazione di <b>${esc(condNome(cf.condId))}</b>. Tra due assemblee servono almeno ${DB.imp.durata} ore (lo cambi in Impostazioni).</p><button class="btn pri" data-act="close">Scegli un altro orario</button>`);return;}}
 if(b==='DB.imp.durata')v=Math.max(0,+v||0);
 setPath(b,v);save();
 if(t.dataset.rer||t.tagName==='SELECT'||t.type==='checkbox'||t.type==='date'||t.type==='time')render();
 else if(t.dataset.rv){clearTimeout(rqT);rqT=setTimeout(()=>{aggiornaAuto();aggiornaEsiti();if(t.dataset.rq)header();},400);}});
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-cmd]'))e.preventDefault();});
document.addEventListener('click',e=>{const c=e.target.closest('[data-cmd]');if(!c)return;if(RANGE&&ED()){ED().focus();const s=getSelection();s.removeAllRanges();s.addRange(RANGE);}document.execCommand(c.dataset.cmd,false,null);salvaDoc();});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.up==='__firma'&&t.files&&t.files[0]){(async()=>{const f=t.files[0];let b=f;try{if(!/png/i.test(f.type))b=await riduci(f);}catch(err){}BLOBS.__firma=b;idbPut('__firma',b);DB.firma=true;render();toast('Firma caricata');})();return;}
 if(t.dataset.up==='__conv'&&t.files&&t.files[0]){importaConv(t.files[0]);t.value='';return;}
 if(t.dataset.up&&t.files&&t.files.length){caricaFile([...t.files],t.dataset.up);return;}
 if(t.dataset.ins==='frase'){if(!t.value)return;const p=S.odg[+t.dataset.arg];const html=fraseHtml(p,t.value);t.value='';if(html){inserisciNelPunto(p,html);toast('Frase inserita nel punto '+(+t.dataset.arg+1));}else toast('Questa frase è vuota: scrivila in Impostazioni');return;}
 const a=t.dataset.actChange;if(!a)return;const arg=t.dataset.arg;
 if(a==='condSel'){DB.condSel=t.value;render();}
 if(a==='delega'){const r=S.pres[arg]=S.pres[arg]||{st:'D'};if(t.value==='__altro'){r.del='';r.delNome=r.delNome||'';}else{r.del=t.value;r.delNome=null;}render();}
 if(a==='escl'){const p=S.odg.find(x=>x.id===S.sv);if(t.checked)p.escl[arg]=true;else delete p.escl[arg];render();}
 if(a==='aPunto'){const[k,pid]=arg.split('|');const x=S.allegati[+k];x.punti=t.checked?[...new Set([...x.punti,pid])]:x.punti.filter(z=>z!==pid);render();}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,arg=b.dataset.arg;const p=S&&S.odg.find(x=>x.id===S.sv);
 switch(a){
 case 'home':salvaDoc();DB.fase=0;if(S)DB.condSel=S.condId;render();window.scrollTo(0,0);break;
 case 'imp':salvaDoc();DB.prev=DB.fase;DB.fase=9;render();window.scrollTo(0,0);break;
 case 'torna':DB.fase=DB.prev&&DB.prev!==9?DB.prev:(S?1:0);if(!S&&DB.fase>0)DB.fase=0;render();break;
 case 'apri':apri(arg);DB.fase=S.stato==='svolta'?3:1;ULT=-1;render();window.scrollTo(0,0);break;
 case 'nuova':{const prec=DB.assemblee.filter(x=>x.condId===DB.condSel).sort((x,y)=>(y.ass.c2.data||'').localeCompare(x.ass.c2.data||''))[0];const A=nuovaAss(DB.condSel);
  if(prec){A.ass.esercizio=prec.ass.esercizio.replace(/\d{4}/g,y=>String(+y+1));A.ass.numero=String((+prec.ass.numero||0)+1);A.ass.c1.luogo=prec.ass.c1.luogo;A.ass.c2.luogo=prec.ass.c2.luogo;}
  DB.assemblee.push(A);apri(A.id);DB.fase=1;ULT=-1;render();window.scrollTo(0,0);toast('Nuova assemblea creata');break;}
 case 'fase':salvaDoc();DB.fase=+arg;ULT=-1;render();window.scrollTo(0,0);break;
 case 'tipo':S.ass.tipo=arg;render();break;
 case 'reset':DB=ESEMPIO();S=null;ULT=-1;render();toast('Dati di esempio ricaricati');break;
 case 'addP':S.odg.push(P('Nuovo punto','','ORD','ord'));render();break;
 case 'delP':{const id=S.odg[+arg].id;S.odg.splice(+arg,1);S.allegati.forEach(x=>x.punti=x.punti.filter(z=>z!==id));render();break;}
 case 'mv':{const[i,d]=arg.split('|').map(Number);const j=i+d;[S.odg[i],S.odg[j]]=[S.odg[j],S.odg[i]];render();break;}
 case 'copiaDa':dlg(`<h2>Copia l'ordine del giorno da…</h2>${S.storico.map(s=>`<div class="row" style="justify-content:space-between;border-top:1px solid #EDF0F4;padding-top:8px"><span><strong>${esc(s.ass.tipo)} del ${dataIt(s.ass.c2.data)}</strong><br><span class="muted">${s.odg.map(x=>esc(x.titolo)).join(' · ')}</span></span><button class="btn sm pri" data-act="copiaOk" data-arg="${s.id}">Copia</button></div>`).join('')}
<label class="chk"><input type="checkbox" id="annoPiu" checked> aggiorna gli anni (+1)</label><label class="chk"><input type="checkbox" id="sostituisci" checked> sostituisci l'ordine del giorno attuale</label><button class="btn" data-act="close">Annulla</button>`);break;
 case 'copiaOk':{const s=S.storico.find(x=>x.id===arg);const piu=$('#annoPiu').checked,sost=$('#sostituisci').checked;const up=t=>piu?t.replace(/\b(20\d\d)\b/g,y=>String(+y+1)):t;
  const nuovi=s.odg.map(x=>P(up(x.titolo),x.tab,x.magg,x.chi,x.note));if(sost){S.odg=nuovi;S.allegati.forEach(x=>x.punti=[]);}else S.odg.push(...nuovi);$('#dlg').innerHTML='';render();toast('Ordine del giorno copiato');break;}
 case 'close':$('#dlg').innerHTML='';IMP=null;break;
 case 'impTipo':IMP.j.tipo=arg;document.querySelectorAll('[data-act=impTipo]').forEach(x=>x.classList.toggle('on',x.dataset.arg===arg));break;
 case 'impOk':applicaImp();break;
 case 'addA':S.allegati.push({id:'g'+Date.now().toString(36),titolo:'Nuovo allegato',punti:arg?[arg]:[],fase:S.ass.oraAppello?'assemblea':'convocazione',da:'',files:[]});render();break;
 case 'delA':S.allegati=S.allegati.filter(x=>x.id!==arg);render();break;
 case 'delF':{const[aid,fid]=arg.split('|');const x=S.allegati.find(y=>y.id===aid);x.files=x.files.filter(f=>f.id!==fid);delete BLOBS[fid];idbDel(fid);render();break;}
 case 'vedi':{const bl=await getBlob(arg);if(!bl){toast('File non trovato su questo dispositivo');break;}dlg(`<img src="${URL.createObjectURL(bl)}" alt="Anteprima" style="max-width:100%;max-height:70vh;object-fit:contain"><button class="btn" data-act="close">Chiudi</button>`);break;}
 case 'addFrase':{const k='m'+Date.now().toString(36);DB.frasi[k]={nome:'Nuova frase',testo:''};render();break;}
 case 'delFrase':delete DB.frasi[arg];render();break;
 case 'sv':{S.sv=arg;const q=S.odg.find(x=>x.id===arg);if(q){S.cur=q.id;if(!q.inserito&&ED())inserisciSezione(q);}render();const sc=q&&sezione(q);if(sc)sc.scrollIntoView({block:'start',behavior:'smooth'});break;}
 case 'oraApp':S.ass.oraAppello=ora();render();break;
 case 'oraChiusura':S.ass.chiusura=ora();render();break;
 case 'tuttiAss':S.pres={};render();break;
 case 'pres':{const[pid,st]=arg.split('|');const old=(S.pres[pid]||{}).st||'A';const r=S.pres[pid]=S.pres[pid]||{};r.st=st;
  if((st==='P'||st==='V')&&old!=='P'&&old!=='V'){r.in=ora();if(S.ass.oraAppello&&S.cur)movimento(`Alle ore ${oraIt(r.in)} entra ${nm(pid)}${st==='V'?' in videoconferenza':''}.`);}
  if(st==='D'&&r.del===undefined){r.del='';r.delNome=null;}render();break;}
 case 'esce':{const r=S.pres[arg];r.st='U';r.out=ora();if(S.cur)movimento(`Alle ore ${oraIt(r.out)} esce ${nm(arg)}.`);render();break;}
 case 'rientra':{const r=S.pres[arg];r.st='P';r.in=ora();if(S.cur)movimento(`Alle ore ${oraIt(r.in)} rientra ${nm(arg)}.`);render();break;}
 case 'voto':{const[pid,v]=arg.split('|');p.voti[pid]=p.voti[pid]===v?'':v;render();break;}
 case 'tutti':calc(p).iv.forEach(r=>p.voti[r.pid]=arg);render();break;
 case 'chiudi':{const q=S.odg[+arg];q.snap=JSON.parse(JSON.stringify(calc(q)));q.chiuso=true;const sec=sezione(q)||inserisciSezione(q);
  if(sec&&!MAGG[q.magg].info&&!sec.querySelector('mark[data-esito]'))sec.insertAdjacentHTML('beforeend',`<p class="esito-auto">${markE(q,'frase')}</p>`);
  aggiornaEsiti();const es=esitoTesti(q);const nx=S.odg[+arg+1];S.sv=nx?nx.id:'fine';if(nx){S.cur=nx.id;if(!nx.inserito)inserisciSezione(nx);}render();toast('Punto '+(+arg+1)+' chiuso'+(es&&!es.ok?': NON approvato, controlla la frase nel verbale':''));break;}
 case 'riapri':{const q=S.odg[+arg];q.chiuso=false;q.snap=null;render();break;}
 case 'insAppunti':{const q=S.odg[+arg];if(!q.appunti.trim()){toast('Gli appunti sono vuoti');break;}inserisciNelPunto(q,paragrafi(q.appunti));toast('Appunti inseriti nel verbale');break;}
 case 'insNote':{const q=S.odg[+arg];inserisciNelPunto(q,paragrafi(q.note));toast('Note inserite nel verbale');break;}
 case 'insOra':inserisciQui(esc(oraIt(ora())));break;
 case 'aggPres':aggiornaAuto(true);if(!ED().querySelector('[data-auto="appello"]'))inserisciQui(`<div data-auto="appello">${snAppello()}</div>`);toast('Presenti aggiornati');break;
 case 'nuovaBozza':dlg(`<h2>Ricominciare il verbale?</h2><p>Il testo attuale viene sostituito da una nuova bozza con intestazione, convocazione, ordine del giorno e presenti. I punti si reinseriscono quando li apri.</p><div class="row"><button class="btn pri" data-act="nuovaOk">Ricomincia</button><button class="btn" data-act="close">Annulla</button></div>`);break;
 case 'nuovaOk':S.docHtml=bozzaIniziale();S.odg.forEach(x=>x.inserito=false);S.cur=null;$('#dlg').innerHTML='';ULT=-1;render();break;
 case 'insChiusura':{if(!S.ass.chiusura)S.ass.chiusura=ora();const ed=ED();const old=ed.querySelector('section[data-chiusura]');if(old)old.remove();const s=document.createElement('section');s.dataset.chiusura='1';s.innerHTML=snChiusura();ed.appendChild(s);S.stato='svolta';salvaDoc();render();s.scrollIntoView({block:'start'});toast('Chiusura inserita');break;}
 case 'mic':if(!DICTNS){toast('Dettatura non disponibile qui: usa il microfono della tastiera del tablet');break;}if(DICT.live){try{await DICTNS.stop();}catch(err){}}else{DICTNS.start().catch(err=>toast(err&&err.code==='not_granted'?'Microfono non autorizzato':'Dettatura non avviata'));}break;
 case 'bozza':{const q=S.odg[+arg],out=$('#aiOut');out.style.display='block';const pres=Object.keys(S.persone).filter(x=>presenza(x).in).map(nm).join(', ');
  const txt=await askClaude(`Sei il segretario di un'assemblea di condominio in Italia. Riscrivi gli appunti come paragrafo di verbale per il punto all'ordine del giorno indicato. ${REGOLE}\n\nPunto: ${q.titolo}\nPresenti: ${pres}\nAppunti:\n${q.appunti||'(vuoti)'}`,out);
  if(txt){out.dataset.txt=txt;const r=document.createElement('div');r.className='row';r.style.marginTop='8px';r.innerHTML=`<button class="btn pri sm" data-act="usaBozza" data-arg="${arg}">Inserisci nel verbale</button><button class="btn sm" data-act="bozza" data-arg="${arg}">Rigenera</button>`;out.appendChild(r);}break;}
 case 'usaBozza':{const q=S.odg[+arg];inserisciNelPunto(q,paragrafi($('#aiOut').dataset.txt));toast('Inserito nel verbale');break;}
 case 'sugg':{const i=+arg,q=S.odg[i],out=$('#sug-'+i);out.style.display='block';
  const txt=await askClaude(`Sei un esperto di amministrazione condominiale italiana. Per il punto all'ordine del giorno suggerisci tabella, maggioranza e chi vota. Usa SOLO i codici dati.\nTabelle: ${S.tabelle.map(t=>t.id+'='+t.nome).join('; ')}\nMaggioranze: ${Object.entries(MAGG).map(([k,m])=>k+'='+m.nome).join('; ')}\nChi vota: ${Object.entries(CHI).map(([k,v])=>k+'='+v).join('; ')}\nPunto: ${q.titolo}\nNote: ${q.note||'(nessuna)'}\nRispondi SOLO con JSON: {"tab":"","magg":"","chi":"","ripartizione":"una frase su come si ripartisce la spesa","motivo":"max 2 frasi con articoli"}`,out);
  if(!txt)break;let j=null;try{j=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));}catch(err){}if(!j)break;SUG[i]=j;
  out.textContent=`Tabella: ${j.tab} · ${(MAGG[j.magg]||{}).nome||j.magg} · Vota: ${CHI[j.chi]||j.chi}\nRipartizione: ${j.ripartizione||''}\nPerché: ${j.motivo||''}`;
  const r=document.createElement('div');r.className='row';r.style.marginTop='8px';r.innerHTML=`<button class="btn pri sm" data-act="applSug" data-arg="${i}">Applica</button><span class="muted">Verifica col regolamento del condominio.</span>`;out.appendChild(r);break;}
 case 'applSug':{const i=+arg,j=SUG[i],q=S.odg[i];if(!j)break;if(S.tabelle.find(t=>t.id===j.tab))q.tab=j.tab===S.ass.tab?'':j.tab;if(MAGG[j.magg])q.magg=j.magg;if(CHI[j.chi])q.chi=j.chi;render();toast('Suggerimento applicato');break;}
 case 'askDlg':dlg(`<h2>Chiedi a Claude</h2><span class="muted">Dubbi su norme e maggioranze. Risposta da verificare.</span><textarea id="askQ" rows="3" placeholder="es. il conduttore vota sugli orari del riscaldamento?"></textarea><div class="row"><button class="btn ai" data-act="ask">Chiedi</button><button class="btn" data-act="close">Chiudi</button></div><div class="aiout" id="askA"></div>`);$('#askQ').focus();break;
 case 'ask':await askClaude(`Sei un esperto di diritto condominiale italiano e assisti un amministratore. Rispondi breve e pratico, cita gli articoli (c.c., disp. att.) e segnala se la questione è controversa.\nDomanda: ${$('#askQ').value}`,$('#askA'));break;
 case 'delFirma':DB.firma=false;delete BLOBS.__firma;idbDel('__firma');render();break;
 case 'copia':try{await navigator.clipboard.writeText(ED().innerText);toast('Testo copiato');}catch(err){toast('Copia non riuscita');}break;
 case 'rivedi':await askClaude(`Rileggi questo verbale di assemblea condominiale italiana. Elenca in punti brevi: refusi, frasi poco chiare, incoerenze (nomi, numeri, orari, lettere degli allegati), parti mancanti. Non riscriverlo. Se è tutto a posto, dillo in una riga.\n\n${ED().innerText}`,$('#revOut'),{modelTier:'complex'});break;
 case 'pdf':{const lbl=b.textContent;b.disabled=true;b.textContent='Preparo il PDF…';try{const r=await creaPDF(arg);const nome=((arg==='firma'?'Verbale da firmare ':'Verbale e allegati ')+S.ass.numero+' '+condNome(S.condId)).replace(/[^\w\- ]+/g,'').replace(/\s+/g,'_')+'.pdf';
  if(r.errori.length)toast('Attenzione: '+r.errori.join('; '));if(!DL)toast('Il salvataggio file non è disponibile in questa vista');else{try{await DL.save({filename:nome,data:new Blob([r.bytes],{type:'application/pdf'})});toast('PDF di '+r.pagine+' pagine pronto');}catch(err){if(err&&err.code!=='declined')toast('Salvataggio non riuscito');}}}
  catch(err){toast('Errore nel PDF: '+(err.message||err));}b.disabled=false;b.textContent=lbl;break;}
 }});
render();
</script>
